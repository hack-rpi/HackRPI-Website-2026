<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | EatEatCloudCloud</title>
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0;">
    <canvas id="unity-canvas" width=960 height=540 tabindex="-1" style="width: 960px; height: 540px; background: #231F20"></canvas>
    <script src="Build/WebClientBuild.loader.js"></script>
    <script>
      (function () {
        var NativeWebSocket = window.WebSocket;
        var BAKED_IN = /^wss?:\/\/98\.87\.150\.200(:\d+)?/;
        var SERVER = "wss://game.hackrpi.com";
        function PatchedWebSocket(url, protocols) {
          if (typeof url === "string" && BAKED_IN.test(url)) {
            url = url.replace(BAKED_IN, SERVER);
          }
          return protocols === undefined
            ? new NativeWebSocket(url)
            : new NativeWebSocket(url, protocols);
        }
        PatchedWebSocket.prototype = NativeWebSocket.prototype;
        ["CONNECTING", "OPEN", "CLOSING", "CLOSED"].forEach(function (k) {
          PatchedWebSocket[k] = NativeWebSocket[k];
        });
        window.WebSocket = PatchedWebSocket;
      })();
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";

      } else {
        // Fill the iframe at 16:9 instead of the fixed 960x540.
        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "min(100vw, calc(100vh * 16 / 9))";
        canvas.style.height = "min(56.25vw, 100vh)";
        canvas.style.display = "block"; // avoids the inline gap that adds a scrollbar
        canvas.style.margin = "0 auto";
      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/WebClientBuild.data",
        frameworkUrl: "Build/WebClientBuild.framework.js",
        codeUrl: "Build/WebClientBuild.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Squister",
        productName: "EatEatCloudCloud",
        productVersion: "1.5",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      }).then((unityInstance) => {
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
